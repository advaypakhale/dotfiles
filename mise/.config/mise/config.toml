[tools]
# nightly for built-in autoread filewatchers
neovim = "nightly"
ripgrep = "latest"
fd = "latest"
gh = "latest"
lazygit = "latest"

# Neovim's toolchain lives in nvim/.config/nvim/mise.toml: on the login PATH
# its python would shadow the system 3.10 that ROS Humble is built against.

[settings]
# resolved versions + checksums pinned in mise.lock (stowed alongside)
lockfile = true
