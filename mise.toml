[tasks.stow]
description = "symlink server config packages"
run = """
if [ -f "$HOME/.bashrc" ] && [ ! -L "$HOME/.bashrc" ]; then
  mv "$HOME/.bashrc" "$HOME/.bashrc.pre-dotfiles"
fi
stow -R -t ~ bash bin claude mise nvim tmux
"""

[tasks.tools]
description = "install pinned tools from the stowed global config"
depends = ["stow"]
run = "mise install"

[tasks.tmux-plugins]
run = '[ -d ~/.config/tmux/plugins/tpm ] || git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm'

[tasks.claude]
run = '[ -x "$HOME/.local/bin/claude" ] || curl -fsSL https://claude.ai/install.sh | bash'

[tasks.agent-skills]
description = "clone agent-skills and link it as ~/.claude/skills"
run = "./scripts/install_agent_skills.sh"

[tasks.bootstrap]
description = "server profile: config + tools"
depends = ["tools", "tmux-plugins", "claude", "agent-skills"]
run = "mise doctor >/dev/null"

[tasks.stow-desktop]
run = "stow -R -t ~ alacritty xournalpp"

[tasks.fonts]
run = "./scripts/install_jetbrains_mono.sh"

[tasks.desktop]
description = "server profile plus laptop-only packages and fonts"
depends = ["bootstrap", "stow-desktop", "fonts"]
run = "true"

[tasks.trackpoint]
description = "thinkpad-only, uses sudo; not part of any profile"
run = "./scripts/install_trackpoint.sh"
